name: iOS Build

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Distribution type"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - ad-hoc
  push:
    branches: ["claude/**"]
    paths:
      - "ios/**"
      - "src/**"
      - "App.tsx"
      - "package.json"

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm install --ignore-scripts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: |
          cd ios
          pod install

      - name: Bundle JS
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios/assets

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/ClearPath.xcworkspace \
            -scheme ClearPath \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/ClearPath.xcarchive \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Export unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa-output
          cd $RUNNER_TEMP/ClearPath.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r ClearPath.app Payload/
          zip -r $RUNNER_TEMP/ipa-output/ClearPath-unsigned.ipa Payload/
          ls -lh $RUNNER_TEMP/ipa-output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearPath-unsigned-ipa
          path: ${{ runner.temp }}/ipa-output/ClearPath-unsigned.ipa
          retention-days: 7
