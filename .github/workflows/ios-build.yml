name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "ios/**"
      - "src/**"
      - "App.tsx"
      - "index.js"
      - "package.json"
      - "package-lock.json"

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm install --ignore-scripts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: pod install
        working-directory: ios
        run: pod install

      - name: Bundle JS for production
        run: |
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/ClearPath/main.jsbundle \
            --assets-dest ios/ClearPath/assets

      - name: xcodebuild archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/ClearPath.xcworkspace \
            -scheme ClearPath \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ClearPath.xcarchive" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_ARCHS="x86_64"

      - name: Package IPA
        run: |
          set -euo pipefail
          APPS="$RUNNER_TEMP/ClearPath.xcarchive/Products/Applications"
          OUT="$RUNNER_TEMP/ipa"
          mkdir -p "$OUT/Payload"
          cp -r "$APPS/ClearPath.app" "$OUT/Payload/"
          cd "$OUT"
          zip -r ClearPath-unsigned.ipa Payload/
          echo "IPA size: $(du -sh ClearPath-unsigned.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearPath-unsigned-ipa
          path: ${{ runner.temp }}/ipa/ClearPath-unsigned.ipa
          retention-days: 7

      - name: Print install instructions
        run: |
          echo "================================================"
          echo "IPA built successfully!"
          echo ""
          echo "To install on your iPhone:"
          echo "  Mac:     Drag ClearPath-unsigned.ipa into AltStore"
          echo "  Windows: Use Sideloadly (sideloadly.io) or AltStore"
          echo ""
          echo "Both tools sign the IPA with your free Apple ID"
          echo "and install it wirelessly. Certificate lasts 7 days"
          echo "and auto-renews while AltServer is running."
          echo "================================================"
