name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm install --ignore-scripts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Download MapLibre XCFramework (bypasses SPM signature validation)
        run: |
          set -euo pipefail
          VERSION="6.17.1"
          URL="https://github.com/maplibre/maplibre-gl-native-distribution/releases/download/${VERSION}/MapLibre.xcframework.zip"
          echo "Downloading MapLibre ${VERSION} from ${URL}"
          curl -L --retry 3 --retry-delay 5 "$URL" -o /tmp/MapLibre.xcframework.zip
          unzip -q /tmp/MapLibre.xcframework.zip -d /tmp/maplibre/
          echo "MapLibre XCFramework contents:"
          ls -la /tmp/maplibre/

      - name: Patch maplibre-react-native podspec to use vendored XCFramework
        run: |
          ruby - <<'RUBY'
          spec_path = 'node_modules/@maplibre/maplibre-react-native/maplibre-react-native.podspec'
          content = File.read(spec_path)
          framework_path = '/tmp/maplibre/MapLibre.xcframework'
          # Add vendored_frameworks to the DynamicLibrary subspec so MLRN
          # can find MapLibre headers and binary without using SPM.
          content.sub!(
            /sp\.source_files\s*=\s*"ios\/MLRN\/\*\*\/\*\.\{h,m\}"/,
            "sp.source_files\t= \"ios/MLRN/**/*.{h,m}\"\n    sp.vendored_frameworks = '#{framework_path}'"
          )
          File.write(spec_path, content)
          puts "Patched podspec with vendored_frameworks: #{framework_path}"
          puts content.match(/vendored_frameworks.*/)&.to_s
          RUBY

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-v3-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-v3-

      - name: Set NODE_BINARY for Xcode build phases
        # xcodebuild runs scripts in a restricted PATH; write the absolute node
        # path to .xcode.env.local so react-native-xcode.sh can find it.
        run: echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: pod install
        working-directory: ios
        run: pod install 2>&1 | tee /tmp/pod-install.log; exit ${PIPESTATUS[0]}

      - name: xcodebuild archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/ClearPath.xcworkspace \
            -scheme ClearPath \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ClearPath.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_ARCHS="x86_64" \
            2>&1 | tee /tmp/xcodebuild.log; exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          set -euo pipefail
          APPS="$RUNNER_TEMP/ClearPath.xcarchive/Products/Applications"
          OUT="$RUNNER_TEMP/ipa"
          mkdir -p "$OUT/Payload"
          cp -r "$APPS/ClearPath.app" "$OUT/Payload/"
          cd "$OUT"
          zip -r ClearPath-unsigned.ipa Payload/
          echo "IPA size: $(du -sh ClearPath-unsigned.ipa)"

      - name: Post build errors to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ERRORS=$(grep -E " error: | error\]|BUILD FAILED|error:" /tmp/xcodebuild.log 2>/dev/null | grep -v "note:" | tail -60)
          if [ -z "$ERRORS" ]; then
            ERRORS=$(tail -80 /tmp/xcodebuild.log 2>/dev/null)
          fi
          if [ -z "$ERRORS" ]; then
            ERRORS="pod install output:\n$(tail -50 /tmp/pod-install.log 2>/dev/null)"
          fi
          gh pr comment 1 --repo muldoon711/clearpath --body "$(printf '**iOS Build failed** — errors:\n```\n%s\n```' "$ERRORS")"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearPath-unsigned-ipa
          path: ${{ runner.temp }}/ipa/ClearPath-unsigned.ipa
          retention-days: 7

      - name: Print install instructions
        run: |
          echo "================================================"
          echo "IPA built successfully!"
          echo ""
          echo "To install on your iPhone:"
          echo "  Mac:     Drag ClearPath-unsigned.ipa into AltStore"
          echo "  Windows: Use Sideloadly (sideloadly.io) or AltStore"
          echo ""
          echo "Both tools sign the IPA with your free Apple ID"
          echo "and install it wirelessly. Certificate lasts 7 days"
          echo "and auto-renews while AltServer is running."
          echo "================================================"
