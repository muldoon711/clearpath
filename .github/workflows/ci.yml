name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  privacy-audit:
    name: Privacy Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run privacy audit
        run: node scripts/privacy-audit.js

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test

  schema-validate:
    name: Camera Data Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate schema file
        run: |
          python3 - <<'EOF'
          import json
          import jsonschema.validators

          with open("data/schema.json") as f:
              schema = json.load(f)

          # Validate the schema itself is valid JSON Schema Draft 2020-12
          validator_cls = jsonschema.validators.validator_for(schema)
          validator_cls.check_schema(schema)
          print("Schema is valid JSON Schema.")
          EOF

      - name: Validate sample camera data (if present)
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          import jsonschema

          with open("data/schema.json") as f:
              schema = json.load(f)

          files = glob.glob("data/cameras/*.geojson")
          if not files:
              print("No camera data files found — skipping sample validation.")
              sys.exit(0)

          errors = 0
          for path in files:
              with open(path) as f:
                  data = json.load(f)
              try:
                  jsonschema.validate(data, schema)
                  print(f"OK: {path}")
              except jsonschema.ValidationError as e:
                  print(f"FAIL: {path} — {e.message}")
                  errors += 1

          sys.exit(errors)
          EOF
